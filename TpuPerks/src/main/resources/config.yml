# =========================================================
#  TpuPerks - Configuración
# =========================================================

settings:
  # Cada cuántos niveles de experiencia el jugador gana 1 Perk Point.
  levels-per-point: 20

  # Nivel mínimo de experiencia que el jugador debe mantener para que
  # sus perks activos sigan funcionando. Si baja de este umbral
  # (por ejemplo al gastar niveles en un yunque), sus perks se desactivan
  # automáticamente hasta que vuelva a superarlo.
  min-level-threshold: 10

  # Cada cuántos ticks (20 ticks = 1 segundo) se revisa que los jugadores
  # online sigan cumpliendo el umbral mínimo. No hace falta que sea instantáneo.
  threshold-check-interval-ticks: 100

  # Rango máximo que se puede comprar de cada perk. 0 = sin límite (infinito).
  # Ejemplo: si quieres permitir hasta 20 corazones extra, con perk-values.health=2.0
  # (cada rango = 1 corazón = 2.0 de vida), pon max-rank: 20 o déjalo en 0 para infinito.
  max-rank: 0

  # Fórmula de costo en puntos para subir de rango: cost = base + (increment * rango_actual)
  # Con los valores por defecto: rango 0->1 cuesta 1, 1->2 cuesta 2, 2->3 cuesta 3, etc.
  cost:
    base: 1
    increment-per-rank: 1

  # Si el botón "↺ Redistribuir Perks" aparece en la GUI (/tpu perks). Permite al
  # jugador devolver TODOS sus rangos comprados a 0 y recuperar el costo total como
  # Perk Points disponibles, para repartirlos de nuevo como quiera. NO afecta
  # desbloqueos permanentes (recetas/advancements ya obtenidos, como el Legado del
  # Héroe Verdadero) ni el nivel de experiencia del jugador. Default: activo.
  enable-reset-button: true

# Valor que aporta CADA rango de los perks que no usan amplifier de PotionEffect
# (Strength, Speed, Resistance y Haste escalan directo por amplifier: rango 1 = nivel I,
# rango 2 = nivel II, etc. y no se configuran aquí).
perk-values:
  # 2.0 puntos de vida = 1 corazón. Con esto, rango 20 = +20 corazones extra.
  health: 2.0
  # Bloques de alcance añadidos por rango (aplica tanto a interacción de bloques como de entidades).
  reach: 1.0

  # Segundos que arde el objetivo golpeado por un jugador con el perk "Incinerador" activo.
  incinerator-fire-seconds: 4

  # Pesos relativos (no tienen que sumar 100, se normalizan solos) para sortear cuántos
  # encantamientos (0 a 5) recibe un ítem crafteado con "Maestría del Artesano" activo.
  # Cuanto MÁS ALTO el peso, MÁS PROBABLE ese resultado. Por defecto: 0 es lo más probable
  # y 5 lo menos probable, tal como se pidió (progresión exponencial decreciente).
  craftsman:
    weight-0: 45   # 0 encantamientos: el resultado más común, ni una probabilidad garantizada.
    weight-1: 25
    weight-2: 15
    weight-3: 9
    weight-4: 4
    weight-5: 2    # 5 encantamientos: rarísimo.

  # Igual que "craftsman" pero para "Maestría del Herrero" (solo armaduras).
  # Usa los mismos pesos por defecto; se puede ajustar por separado si se quiere
  # que las armaduras sean más o menos generosas que las herramientas/armas.
  blacksmith:
    weight-0: 45
    weight-1: 25
    weight-2: 15
    weight-3: 9
    weight-4: 4
    weight-5: 2

  # Porcentaje de reducción de daño de fuego/lava por CADA rango de "Forjado en Fuego"
  # (Temple del Volcán). 0.05 = 5%. Con el máximo de 5 rangos: 5*0.05 = 25% de reducción.
  fire_forged-percent-per-rank: 0.05

  # Probabilidad de robar vida al golpear en cuerpo a cuerpo con "Sed Carmesí"
  # (Vampirismo) activo. 0.05 = 5%, tal como se pidió explícitamente.
  vampirism-chance: 0.05
  # Cantidad de vida (en puntos, no corazones) que cura cada vez que se activa
  # el robo de vida. 2.0 = 1 corazón.
  vampirism-heal-amount: 2.0

# Nota sobre perks ÚNICOS (double_jump, incinerator, craftsman_mastery, blacksmith_mastery,
# magnetism, expert_swimmer, vampirism, chosen_emblem): no escalan por rango (no tienen
# niveles I, II, III...). Su costo se calcula igual que el resto con la fórmula de
# settings.cost (base + increment * rango_actual), pero como su rango solo puede ser 0 o 1,
# en la práctica siempre cuestan "settings.cost.base" puntos.
#
# "Forjado en Fuego" (fire_forged) SÍ escala por rango, pero con un tope PROPIO de 5 rangos
# máximo (fijo en el código), sin importar lo que diga settings.max-rank.
#
# "Maestría del Artesano" (craftsman_mastery) exige nivel 100+, "Maestría del Herrero"
# (blacksmith_mastery) exige nivel 150+, y "Blasón del Elegido" (chosen_emblem) exige
# nivel 125+, tanto para COMPRARLOS como para mantenerlos ACTIVOS, sin importar lo que
# diga settings.min-level-threshold (ese requisito es adicional, no lo reemplaza).
#
# "Blasón del Elegido" otorga +5 corazones fijos de vida máxima (siempre que esté activo,
# no escala) y, cuando el jugador cae a 5 corazones o menos, dispara un aviso épico GLOBAL
# (sonido + mensaje de chat a todo el servidor) con un cooldown de 1 hora por jugador.
# Este aviso es solo dramático: no cura ni protege al jugador de ningún daño.
#
# "Legado del Héroe Verdadero" (true_hero) exige nivel 200+ para comprarse.
#
# REVOCACIÓN DE PUNTOS POR PÉRDIDA DE XP: si un jugador gasta experiencia (yunque, mesa
# de encantar, etc.) y su nivel cae por debajo del "lote" de niveles que le había dado
# alguno de sus Perk Points, el sistema se lo quita automáticamente: primero de los
# puntos disponibles sin gastar, y si ya no le quedan, deshaciendo (retrocediendo 1 rango)
# la última compra de perk que hizo, en orden inverso a como las fue comprando.
