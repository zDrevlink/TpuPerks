name: TpuPerks
version: '1.0.0'
main: com.tpu.perks.TpuPerks
api-version: '1.21'
author: TpuPerks
description: Sistema ligero de perks escalables basados en niveles de experiencia.

commands:
  tpu:
    description: Comando principal de TpuPerks.
    usage: /tpu <perks|levels>

permissions:
  tpuperks.admin.levels:
    description: Permite usar /tpu levels give y /tpu levels get.
    default: op
